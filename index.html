<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Sunum - Sign2Key Sanal Klavye</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 24px 16px;
    }
    main {
      width: min(1100px, 100%);
      margin: 0 auto;
    }
    .presentation {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(63, 69, 81, .16);
      background: #fff;
    }
    .presentation iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .source-link {
      display: inline-block;
      margin-top: 12px;
      color: #2457c5;
      text-decoration: none;
    }
    .source-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="presentation">
      <iframe
        loading="lazy"
        src="https://www.canva.com/design/DAHb7bKlCNg/xo6-laxN9MXCFMXuW803Yw/view?embed"
        title="Sunum - Sign2Key Sanal Klavye"
        allowfullscreen
        allow="fullscreen">
      </iframe>
    </div>
    <a class="source-link"
       href="https://www.canva.com/design/DAHb7bKlCNg/xo6-laxN9MXCFMXuW803Yw/view?utm_content=DAHb7bKlCNg&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link"
       target="_blank"
       rel="noopener noreferrer">Sunumu Canva'da aç</a>
